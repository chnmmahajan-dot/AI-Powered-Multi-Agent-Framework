
name: AI Automation Framework CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Start demo application
        run: |
          python -m http.server 8000 --directory demo_app &
          for i in {1..15}; do
            if curl -s http://127.0.0.1:8000 > /dev/null; then
              echo "Demo application is ready"
              break
            fi
            sleep 1
          done

      - name: Run automated tests
        run: |
          python -m pytest tests/test_requirement_reader.py \
            tests/test_test_generation_agent.py \
            tests/test_test_execution_agent.py \
            tests/test_demo_login.py -v

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-results
          path: |
            reports/
            generated_tests/
